<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>theyearbook</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-image: url("yearbook_20261017175259.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .titulo {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .titulo img {
            width: 90%;
            max-width: 600px;
            height: auto;
            object-fit: contain;
        }

        .anuario {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 15px;
        }


        .libro {
            position: relative;
            width: 90%;
            max-width: 760px;
        }

        .libro > img {
            display: block;
            width: 100%;
            height: auto;
        }

        
        .victim {
            position: absolute;
            width: 17%;
            height: 21%;
            border: 2px solid transparent;
            background: transparent;
            cursor: pointer;
            border-radius: 3px;
        }

        .victim:hover,
        .victim:focus-visible {
            border-color: none;
            background: transparent;
            outline: none;
        }

       
        .algernon  { left: 7%;  top: 5%; }
        .angie   { left: 27%; top: 5%; }
        .bucky    { left: 55%; top: 5%; }

       
        .beatrice { left: 7%;  top: 34%; }
        .bif     { left: 27%; top: 35%; }
        .christy  { left: 75%; top: 35%; }
        .const    {left: 56%; top: 65%;}
        @media (max-width: 600px) {
            .anuario {
                padding: 0 5px;
            }

            .libro {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="titulo">
        <img src="photos.png" alt="Yearbook Photos">
    </div>

    <div class="anuario">
        <div class="libro">

            <img
                src="yearbook_1_20261017175531.png"
                alt="Anuario de Bullworth Academy"
            >

            <button class="victim algernon"
                aria-label="Algernon"
                onclick="abrirFicha('Algernon')"></button>

            <button class="victim angie"
                aria-label="Angie"
                onclick="abrirFicha('Angie')"></button>

            <button class="victim bucky"
                aria-label="Bucky"
                onclick="abrirFicha('Bucky')"></button>

            <button class="victim beatrice"
                aria-label="Beatrice"
                onclick="abrirFicha('Beatrice')"></button>

            <button class="victim bif"
                aria-label="Bif"
                onclick="abrirFicha('Bif')"></button>

            <button class="victim christy"
                aria-label="Christy"
                onclick="abrirFicha('Christy')"></button>

                 <button class="victim const"
                aria-label="Constantinos"
                onclick="abrirFicha('Constantinos')"></button>

        </div>
    </div>

      <audio id="ambiente" loop>
        <source src="ambience.mp3" type="audio/mpeg">
    </audio>

<script>
        const ambiente = document.getElementById("ambiente");

        window.addEventListener("pointerdown", function iniciarAudio() {
            ambiente.play().catch(() => {});
        }, { once: true });

        window.addEventListener("keydown", function iniciarAudio() {
            ambiente.play().catch(() => {});
        }, { once: true });

        // Mostrar el enlace después de cinco segundos.
        window.addEventListener("load", function () {
            setTimeout(function () {
                document.getElementById("enlace")
                    .classList.add("visible");
            }, 5000);
        });
    </script> 

<script>
    function abrirFicha(nombre) {
        const paginas = {
            "Algernon": "algernon.html",
            "Angie": "angie.html",
            "Bucky": "bucky.html",
            "Beatrice": "beatrice.html",
            "Bif": "bif.html",
            "Christy": "christy.html",
            "Constantinos": "constantinos.html"
        };

        if (paginas[nombre]) {
            window.location.href = paginas[nombre];
        }
    }
</script>

</body>
</html>
